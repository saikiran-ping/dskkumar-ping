pingaccessWas:
  serverProfilePath: "profiles/pingaccess"
  podReaperEnabled: true
  javaOpts: "-javaagent:/opt/staging/jmx_prometheus_javaagent-0.14.0.jar=8080:/opt/in/instance/conf/jmx_export_config.yaml"

  license:
    # Only use if you want to provide your own SSM path to perpetual license
    # The default is that automation will determine SSM path to retrieve product license
    overrideProductLicense: ""

  admin:
    verbose: "false"
    skipLiveness: "false"
    configQueryKpValidDays: "365"
    # PingAccess Heap
    paWasMinHeap: "1024m"
    paWasMaxHeap: "1024m"
    paWasMinYgen: "512m"
    paWasMaxYgen: "512m"
    paWasGcOption: "-XX:+UseParallelGC -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90"

    # Individual files should be spelled out, globs are unreliable
    k8sTailLogFiles: "/opt/out/instance/log/pingaccess_engine_audit.log /opt/out/instance/log/pingaccess_api_audit.log /opt/out/instance/log/pingaccess_sideband_audit.log /opt/out/instance/log/pingaccess_sideband_client_audit.log /opt/out/instance/log/pingaccess.log /opt/out/instance/upgrade/log/upgrade.log /opt/out/instance/upgrade/log/audit.log /opt/out/instance/log/pingaccess_api_audit_har.log"

    restore:
      backupFileName: ""
      restoreBackup: "true"

    statefulSet:
      lastUpdateReason: "NA"
      replicas: 1
      resources:
        limits:
          memory: "2560Mi"
          cpu: "1"
        requests:
          memory: "1280Mi"
          cpu: "20m"
      upgradeResources:
        limits:
          memory: "6Gi"
          cpu: "2"
        requests:
          memory: "6Gi"
          cpu: "2"

    ingress:
      enableExternalIngress: false
      ingressClassName: "nginx-private"

    persistentVolume:
      storageClassName: "pingaccess-was-gp3"
      storageProvisioner: "ebs.csi.aws.com"
      fsType: "ext4"
      storageType: "gp3"
      size: "20Gi"


  engine:
    verbose: "false"
    skipLiveness: "false"

    # PingAccess Heap
    paWasMinHeap: "1024m"
    paWasMaxHeap: "1024m"
    paWasMinYgen: "512m"
    paWasMaxYgen: "512m"
    paWasGcOption: "-XX:+UseParallelGC -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90"

    # Individual files should be spelled out, globs are unreliable
    k8sTailLogFiles: "/opt/out/instance/log/pingaccess_engine_audit.log /opt/out/instance/log/pingaccess_api_audit.log /opt/out/instance/log/pingaccess_sideband_audit.log /opt/out/instance/log/pingaccess_sideband_client_audit.log /opt/out/instance/log/pingaccess.log /opt/out/instance/upgrade/log/upgrade.log /opt/out/instance/upgrade/log/audit.log /opt/out/instance/log/pingaccess_api_audit_har.log"

    statefulSet:
      lastUpdateReason: "NA"
      # Number of replicas for the PingAccess-WAS engine StatefulSet in customer-hub.
      # Replicas are set explicitly for customer-hub because there is no HPA managing scaling due to cost savings.
      chubReplicas: 2
      podDisruptionBudget:
        minAvailable: "30%"
      hpa:
        minReplicas: 2
        maxReplicas: 2
        averageUtilization: 70
      resources:
        limits:
          memory: "2560Mi"
          cpu: "1"
        requests:
          memory: "1280Mi"
          cpu: "100m"

    ingress:
      ingressClassName: "nginx-public"
      commonAnnotations:
        nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
        nginx.ingress.kubernetes.io/enable-modsecurity: "true"
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        nginx.ingress.kubernetes.io/modsecurity-snippet: |
          Include /etc/nginx/owasp-modsecurity-crs/nginx-modsecurity.conf
          SecRuleEngine DetectionOnly
          SecRequestBodyAccess On
          SecAuditEngine RelevantOnly
          SecAuditLogParts ABCDEFGHIJKZ
          SecAuditLogType Serial
          SecAuditLogFormat JSON
          SecAuditLog /dev/stdout


  # Periodic CronJob settings for backing up PingAccess-was Admin
  periodicBackupCronJob:
    schedule: "30 * * * *"
    resources:
      limits:
        memory: "50Mi"
        cpu: "50m"
      requests:
        memory: "25Mi"
        cpu: "25m"
