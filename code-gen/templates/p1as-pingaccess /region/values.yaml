# pingaccess application settings that are shared with both pingaccess Admin and Engine
pingaccess:
  irsaPaAnnotationKeyValue: "${IRSA_pa_ANNOTATION_KEY_VALUE}"
  podReaperEnabled: "enabled"

  license:
    # Only use if you want to provide your own SSM path to perpetual license
    # The default is that automation will determine SSM path to retrieve product license
    overrideProductLicense: ""

  # Application settings that is only for pingaccess Admin
  admin:
    paLogLevel: "INFO"
    verbose: false
    # pingaccess Heap
    paMinHeap: "1024m"
    paMaxHeap: "1024m"
    paMinYgen: "512m"
    paMaxYgen: "512m"

    # Restore Variables
    restore:
      # Choose desired backup to restore from S3. The default is latest.zip which is the most recent backup.
      backupaileName: ""

      # When deleting pingaccess Admin PVC.
      # Automation will attempt to pull the latest.zip unless specified differently using 'backupaileName' variable.
      # Set 'restoreBackup' to 'false' if you don't want to restore the latest backup from S3.
      restoreBackup: true

    # The following will set pingaccess the minimum and the maximum
    # number of threads used to configure pingaccess thread pools within run.properties.
    # By default, this was designed to be empty and the P1AS automation will
    # dynamically set based on the CPU of the pod. Only override these 2 variables if you truly want to set yourself.
    # 'pa_JETTY_THREADS_MIN' and 'pa_JETTY_THREADS_MAX' is determined for admin.
    paJettyThreadsMin: ""
    paJettyThreadsMax: ""

    # Control Ingress Resource for pingaccess Admin
    ingress:
      enableExternalIngress: false

    # Set container limits for the pingaccess Admin Statefulset
    statefulSet:
      lastUpdateReason: "NA"
      resources:
        limits:
          memory: "4Gi"
          cpu: "1"
        requests:
          memory: "4Gi"
          cpu: "1"

    # Persistent volume size configuration for pingaccess Admin.
    persistentVolume:
      size: 20Gi

  # Application settings that is only for pingaccess Engine
  engine:
    paLogLevel: "INFO"
    verbose: false
    paMinHeap: "1024m"
    paMaxHeap: "1024m"
    paMinYgen: "512m"
    paMaxYgen: "512m"

    # The following will set pingaccess the minimum and the maximum
    # number of threads used to configure pingaccess thread pools within run.properties.
    # By default, this was designed to be empty and the P1AS automation will
    # dynamically set based on the CPU of the pod. Only override these 2 variables if you truly want to set yourself.
    # 'pa_JETTY_THREADS_MIN' and 'pa_JETTY_THREADS_MAX' is determined for runtime engine.
    paJettyThreadsMin: ""
    paJettyThreadsMax: ""

    # Set container limits for the pingaccess Engine Statefulset
    statefulSet:
      lastUpdateReason: "NA"
      replicas: "2"
      resources:
        requests:
          memory: "4Gi"
          cpu: 2
        limits:
          memory: "4Gi"
          cpu: 2
      podDisruptionBudget:
        minAvailable: "30%"
      hpa:
        minReplicas: 2
        maxReplicas: 2
        averageUtilization: 70

  # Outbound provisioning settings
  provisioning:
    # Secret path for storing Provisioning RDS database details
    provisioningRdsDetails: "${pa_RDS_SECRET_PATH}"

  # Periodic CronJob settings for backing up pingaccess Admin
  periodicBackupCronJob:
    schedule: "30 * * * *"
    resources:
      limits:
        memory: "50Mi"
        cpu: "50m"
      requests:
        memory: "25Mi"
        cpu: "25m"

  # Radius Proxy settings
  radiusProxy:
    enabled: false

    # Control side-car container within pingaccess statefulset
    statefulSet:
      resources:
        requests:
          memory: "200Mi"
          cpu: "200m"
        limits:
          memory: "500Mi"
          cpu: "400m"

  # Heartbeat Exporter settings
  heartbeatExporter:

    # Control side-car container within pingaccess statefulset
    statefulSet:
      resources:
        requests:
          memory: "300Mi"
          cpu: "100m"
        limits:
          memory: "300Mi"
          cpu: "100m"
